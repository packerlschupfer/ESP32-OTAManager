[platformio]
src_dir = .

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
lib_deps =
    symlink://../..
    https://github.com/packerlschupfer/ESP32-MutexGuard.git
# No core2_espressif32 env: this example was ported to the Arduino core 3.x
# Network event API (#include <Network.h>, Network.onEvent()), which does not
# exist on espressif32 6.x (Arduino core 2.x). Pioarduino (core 3.x) only.
